---
- name: Configure and deploy Campus Interview Platform
  hosts: webserver
  become: true

  vars:
    app_port: "5000"

    mongodb_uri: "mongodb+srv://sahilpawarsp045_db_user:SzTyI2cPH7SnYZUB@cluster0.pljunnn.mongodb.net/?appName=Cluster0"
                  
    jwt_secret: "pccoe_campus_interview_platform_secret_key_2024"
    jwt_expire: "7d"

    node_env: "development"

    admin_email: "sahilpawarsp045@gmail.com"
    admin_password: "Admin@12345"
    admin_name: "Sahil Pawar"

    smtp_host: "smtp.gmail.com"
    smtp_port: "465"
    smtp_secure: "true"
    smtp_user: "shaileshx006068@gmail.com"
    smtp_pass: "wngljwlzzbputrjn"
    smtp_from: "shaileshx006068@gmail.com"

  tasks:

    - name: Update apt package index
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull application image from Docker Hub
      community.docker.docker_image:
        name: sahilpawar45/pccoe-campus-platform
        tag: "{{ image_tag }}"
        source: pull

    - name: Stop existing application container
      community.docker.docker_container:
        name: campus-interview
        state: absent

    - name: Start application container
      community.docker.docker_container:
        name: campus-interview
        image: sahilpawar45/pccoe-campus-platform:{{ image_tag }}
        state: started
        restart_policy: unless-stopped
        ports:
          - "5000:5000"
        env:
          PORT: "{{ app_port }}"
          MONGODB_URI: "{{ mongodb_uri }}"

          JWT_SECRET: "{{ jwt_secret }}"
          JWT_EXPIRE: "{{ jwt_expire }}"

          NODE_ENV: "{{ node_env }}"

          ADMIN_EMAIL: "{{ admin_email }}"
          ADMIN_PASSWORD: "{{ admin_password }}"
          ADMIN_NAME: "{{ admin_name }}"

          SMTP_HOST: "{{ smtp_host }}"
          SMTP_PORT: "{{ smtp_port }}"
          SMTP_SECURE: "{{ smtp_secure }}"
          SMTP_USER: "{{ smtp_user }}"
          SMTP_PASS: "{{ smtp_pass }}"
          SMTP_FROM: "{{ smtp_from }}"

    - name: Create monitoring Docker network
      community.docker.docker_network:
        name: monitoring
        state: present

    - name: Start Node Exporter
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: unless-stopped
        network_mode: monitoring
        pid_mode: host
        volumes:
          - /:/host:ro,rslave
        command:
          - --path.rootfs=/host

    - name: Create monitoring directory
      file:
        path: /home/ubuntu/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy Prometheus configuration
      copy:
        src: monitoring/prometheus.yml
        dest: /home/ubuntu/monitoring/prometheus.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Free monitoring ports from old manual containers or services
      shell: |
        for port in 9090 3000; do
          for cid in $(docker ps -a -q --filter "publish=$port"); do
            net=$(docker inspect -f '{% raw %}{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}{% endraw %}' "$cid" 2>/dev/null)
            status=$(docker inspect -f '{% raw %}{{.State.Status}}{% endraw %}' "$cid" 2>/dev/null)
            if [ "$status" != "running" ] || echo "$net" | grep -qv "monitoring"; then
              docker stop "$cid" || true
              docker rm -f "$cid" || true
            fi
          done
        done
        systemctl stop prometheus 2>/dev/null || true
        systemctl disable prometheus 2>/dev/null || true
        systemctl stop grafana-server 2>/dev/null || true
        systemctl disable grafana-server 2>/dev/null || true
        if command -v fuser >/dev/null 2>&1; then
          fuser -k 9090/tcp 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
        fi
      changed_when: false
      failed_when: false

    - name: Start Prometheus
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: unless-stopped
        network_mode: monitoring
        ports:
          - "9090:9090"
        volumes:
          - /home/ubuntu/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    - name: Start Grafana
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: unless-stopped
        network_mode: monitoring
        ports:
          - "3000:3000"