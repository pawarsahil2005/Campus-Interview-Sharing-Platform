name: Campus Interview CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 1. Test the Node.js application
  test:
    name: Test Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check all JavaScript files
        run: |
          find backend tests -type f -name "*.js" -print0 |
            xargs -0 -r -n 1 node --check

      - name: Run unit and API tests
        run: npm test

  # 2. Build and push the Docker image
  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t sahilpawar45/pccoe-campus-platform:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push sahilpawar45/pccoe-campus-platform:${{ github.sha }}

  # 3. Deploy to AWS EC2 using Ansible
  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/mykey.pem
          printf '%s\n' "$EC2_SSH_KEY" > /tmp/mykey.pem

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ansible-galaxy collection install community.docker

      - name: Deploy using Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory \
            ansible/playbook.yml \
            -e "ansible_ssh_private_key_file=/tmp/mykey.pem" \
            -e "image_tag=${{ github.sha }}"

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/mykey.pem